[project]
name = "agentic-workflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andri", email = "rajesynyandrian@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "accelerate>=1.15.0",
    "datasets==3.*",
    "gcsfs<=2025.3.0",
    "google-cloud-aiplatform>=2.4.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "kfp>=2.16.1",
    "langchain-community==0.3.*",
    "pandas==2.2.*",
    "peft==0.13.2",
    "pronouncing==0.2.0",
    "python-dotenv>=1.2.4",
    "ragas==0.2.*",
    "rapidfuzz>=3.14.6",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "transformers==4.46.*",
    "trl==0.12.*",
]

[project.scripts]
agentic-workflows = "agentic_workflows:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
